name = "catatpro"
main = "apps/api/src/worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# SPA + API dilayani satu Worker. Aset di-build dari apps/web (Vite → dist).
[assets]
directory = "apps/web/dist"
binding = "ASSETS"
# Fallback ke index.html untuk rute SPA (mis. /sales, /reports).
not_found_handling = "single-page-application"

[vars]
WEB_ORIGIN = "https://catatpro.workers.dev"

# --- Control plane: D1 (users, organizations, memberships) ---
# Buat: `wrangler d1 create catatpro-control`, lalu isi database_id di bawah.
[[d1_databases]]
binding = "CATATPRO_DB"
database_name = "catatpro-control"
database_id = "GANTI_DENGAN_D1_DATABASE_ID"
migrations_dir = "packages/shared/drizzle/control-migrations"

# --- Data plane: satu Durable Object (SQLite) per organisasi ---
[[durable_objects.bindings]]
name = "ORG_DO"
class_name = "OrgDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrgDO"]

# Secret wajib (sekali set, tidak lewat CI):
#   wrangler secret put AUTH_JWT_SECRET      (mis. `openssl rand -base64 32`)
# Secret sementara khusus migrasi data dari Supabase (hapus setelah selesai):
#   wrangler secret put MIGRATION_ADMIN_SECRET
